<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSmart Travel</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span>ShopSmart Travel</span>
      </div>
    </header>

    <!-- Main content -->
    <main class="main">
      <!-- Not connected state (visible by default) -->
      <div id="notConnected" class="connect-section">
        <div class="connect-icon">🛫</div>
        <h3 class="connect-title">ShopSmart Travel</h3>
        <p class="connect-text">Sign in to access your shopping lists</p>
        <button id="connectBtn" class="btn btn-google">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Sign in with Google
        </button>
      </div>

      <!-- Connected state -->
      <div id="connectedSection" class="hidden">
        <!-- User info -->
        <div class="user-info section">
          <img id="userPhoto" class="user-photo" src="" alt="">
          <div class="user-details">
            <span id="userName" class="user-name"></span>
            <button id="signOutBtn" class="sign-out-btn">Sign out</button>
          </div>
        </div>

        <!-- Trip selection -->
        <div class="section">
          <label class="label">Default Trip</label>
          <select id="tripSelect" class="select">
            <option value="">Loading trips...</option>
          </select>
          <p class="help-text">Items will be added to this trip</p>
        </div>

        <!-- Current page info -->
        <div id="pageInfo" class="section page-info hidden">
          <div class="page-type-badge" id="pageTypeBadge">
            <span id="pageTypeIcon"></span>
            <span id="pageTypeText"></span>
          </div>
        </div>

        <!-- Quick actions -->
        <div class="section">
          <button id="addItemBtn" class="btn btn-primary" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Add This Product
          </button>

          <button id="importCartBtn" class="btn btn-secondary hidden">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="1" y="3" width="15" height="13"></rect>
              <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
              <circle cx="5.5" cy="18.5" r="2.5"></circle>
              <circle cx="18.5" cy="18.5" r="2.5"></circle>
            </svg>
            Import Cart
          </button>
        </div>

        <!-- Sync button -->
        <div class="section">
          <button id="resyncBtn" class="btn btn-outline">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            Re-sync Trips
          </button>
        </div>
      </div>

      <!-- Status message -->
      <div id="statusMessage" class="status-message hidden"></div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <a href="https://shopsmart-800cb.web.app" target="_blank" class="footer-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
        Open ShopSmart
      </a>
    </footer>
  </div>

  <script src="../lib/auth.js"></script>
  <script src="popup.js"></script>
</body>
</html>
